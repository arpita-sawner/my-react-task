<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Start -->
  <div class="bg-white max-w-sm w-full rounded-2xl shadow-lg overflow-hidden">
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" 
         alt="Product" class="w-full h-48 object-cover">
    
    <div class="p-6">
      <h2 class="text-2xl font-bold text-gray-800">Wireless Headphones</h2>
      <p class="text-gray-500 mt-2 text-sm">High quality sound with noise cancellation and 30 hours battery life.</p>
      
      <div class="flex items-center justify-between mt-6">
        <span class="text-xl font-bold text-blue-600">$99.99</span>
        <button class="bg-blue-600 text-white px-5 py-2 rounded-full hover:bg-blue-700">
          Buy Now
        </button>
      </div>
    </div>
  </div>
  <!-- Card End -->

</body>
</html>
