<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Render Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, memo } = React;

    function NormalChild(props) {
      console.log("Normal Child Render -", props.name);
      return (
        <div className="bg-red-50 border border-red-200 p-4 rounded-xl">
          <b>Normal Child (No Memo)</b>
          <p>Name: {props.name}</p>
        </div>
      );
    }

    const MemoChild = memo(function MemoChild(props) {
      console.log("Memo Child Render -", props.name);
      return (
        <div className="bg-green-50 border border-green-200 p-4 rounded-xl mt-3">
          <b>Memo Child (React.memo)</b>
          <p>Name: {props.name}</p>
        </div>
      );
    });

    function App() {
      const [count, setCount] = useState(0);
      const [name, setName] = useState("Siddharth");
      
      console.log("Parent Render - Count:", count);

      return (
        <div className="min-h-screen bg-gray-900 flex justify-center items-center p-4">
          <div className="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h1 className="text-xl font-black">Render Test</h1>
            <p className="text-xs text-gray-500">F12 - Console dekho</p>

            <div className="bg-black text-white p-4 rounded-xl mt-3">
              <p>Parent Count: {count}</p>
              <button onClick={() => setCount(count+1)} className="bg-white text-black px-4 py-2 rounded-full text-sm font-bold mt-2">Count +1</button>
              <button onClick={() => setName(name==="Siddharth"?"Rahul":"Siddharth")} className="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold mt-2 ml-2">Name Badlo</button>
            </div>

            <div className="mt-4">
              <NormalChild name={name} />
              <MemoChild name={name} />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
