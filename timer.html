<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Timer() {
      const [seconds, setSeconds] = useState(0);
      const [isRunning, setIsRunning] = useState(true);

      // Har 1 second me update hoga
      useEffect(() => {
        let interval = null;
        if (isRunning) {
          interval = setInterval(() => {
            setSeconds(s => s + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isRunning]);

      const formatTime = (totalSeconds) => {
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-sm w-full">
            <h1 className="text-gray-500 font-bold tracking-widest text-sm">LIVE TIMER</h1>
            <div className="text-6xl font-black text-blue-600 mt-4 tabular-nums">
              {formatTime(seconds)}
            </div>
            <p className="text-gray-400 mt-3">{new Date().toDateString()}</p>

            <div className="mt-8 flex gap-3 justify-center">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700"
              >
                {isRunning? 'Pause' : 'Resume'}
              </button>
              <button
                onClick={() => setSeconds(0)}
                className="bg-gray-100 px-6 py-2 rounded-full font-bold hover:bg-gray-200"
              >
                Reset
              </button>
            </div>

            <div className="mt-6 text-xs text-gray-400">
              useState + useEffect + setInterval
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Timer />);
  </script>
</body>
</html>
